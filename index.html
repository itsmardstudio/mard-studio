<title>Lilit Mardanian — mard studio</title>
<meta name="description" content="Lilit Mardanian — a one-person studio in Yerevan. Event identities, branding, illustration and creative direction. Take a walk through the work.">
<meta name="theme-color" content="#ececec">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="canonical" href="https://mard.studio/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mard.studio/">
<meta property="og:title" content="mard studio — Lilit Mardanian">
<meta property="og:description" content="A one-person studio in Yerevan. Take a walk through the work.">
<meta property="og:image" content="https://mard.studio/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#ececec; --fg:#111; --red:#ff2a1a; --trail:#ffb3a6; --g1:#888; --g2:#d2d2d2; --g3:#e2e2e2;
  --font:"Inter", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --pad:12px;
  --expo:cubic-bezier(.19,1,.22,1);     /* easings read from gilhuybrecht.com */
  --quint:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{color:var(--fg);font:400 12px/1.3 var(--font);letter-spacing:-.005em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;letter-spacing:inherit}
img{display:block;max-width:100%}
.g{color:var(--g1)}
a:hover,button:hover{color:var(--g1)}

/* ===== Loader (0% → 100%) ===== */
#loader{position:fixed;inset:0;z-index:99;background:rgba(236,236,236,.9);backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px);display:grid;place-items:center;font-variant-numeric:tabular-nums;transition:opacity .8s var(--quint)}
#loader.done{opacity:0;pointer-events:none}
/* during the intro the whole map streams past behind the words, at full colour */
body.intro .proj.ghost{opacity:1;filter:none} body.intro #fig,body.intro #bubble{opacity:0}
#loader .blobs{position:absolute;inset:0;overflow:hidden;opacity:0;animation:wIn 2s var(--quint) .1s forwards}
#loader .blobs i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 16s ease-in-out infinite alternate}
#loader .blobs i:nth-child(1){left:-18vmax;top:-20vmax;background:var(--c1)}
#loader .blobs i:nth-child(2){right:-22vmax;top:-10vmax;background:var(--c2);animation-delay:-4s;animation-direction:alternate-reverse}
#loader .blobs i:nth-child(3){left:10vmax;bottom:-30vmax;background:var(--c3);animation-delay:-8s}
#loader .blobs i:nth-child(4){right:-10vmax;bottom:-26vmax;background:var(--c4);animation-delay:-2s;animation-direction:alternate-reverse}
#loader .blobs i:nth-child(5){left:30vmax;top:20vmax;width:40vmax;height:40vmax;background:var(--c5);animation-delay:-6s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,-4vmax) scale(1.12)}100%{transform:translate(-5vmax,5vmax) scale(.94)}}
#loader .ld{position:relative}
@media (prefers-reduced-motion:reduce){ #loader .blobs i{animation:none} }
#loader .ld{display:grid;gap:6px;justify-items:center;font-size:clamp(16px,1.6vw,22px);letter-spacing:-.01em;white-space:pre}
#loader p{opacity:0;animation:wIn 1s var(--quint) .1s forwards}
#loader p.fade{transition:opacity .6s ease}
@keyframes wIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== Canvas ===== */
#canvas{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;perspective:1500px}
/* while you drag, the map leans like a sheet of paper pushed across a table, then settles flat */
#tilt{position:absolute;inset:0;transform-origin:50% 50%;transform-style:preserve-3d;will-change:transform}
/* the 3D layers must not catch the mouse: only the works do (otherwise tiles set "behind" the layer cannot be hovered or clicked) */
#tilt,#world,.block,#blocks{pointer-events:none} .proj{pointer-events:auto}
#canvas.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;transform-style:preserve-3d}
.block{position:absolute;left:0;top:0;transform-style:preserve-3d}
.proj{position:absolute;width:var(--w);cursor:pointer;transform:translateZ(var(--z,0px))}   /* works sit at slightly different heights: parallax while tilting */
.proj h2{display:flex;justify-content:space-between;gap:10px;height:30px;align-items:flex-end;padding-bottom:8px;font-size:18px;font-weight:400;white-space:nowrap;
  opacity:0;transform:translateY(14px);transition:opacity .9s var(--quint),transform 1.1s var(--expo)}
.proj h2 span:first-child{overflow:hidden;text-overflow:ellipsis}
.proj .sq{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:var(--g3);transition:transform .7s var(--expo)}
.proj .sq img,.proj .sq video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;opacity:0;transition:opacity 1s ease-out}
.proj.in:hover h2,body.near .proj.in h2{opacity:1;transform:none}
.proj{isolation:isolate}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.proj h2 .mono{align-self:flex-end;padding-bottom:2px}
/* small archive labels under each work (client · type, number) */
.proj .cap{position:absolute;left:0;right:0;top:100%;margin-top:9px;display:flex;justify-content:space-between;gap:10px;font:400 10px/1.2 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--g1);white-space:nowrap;
  opacity:0;transform:translateY(-4px);transition:opacity .6s var(--quint),transform .8s var(--expo);pointer-events:none}
.proj .cap span:first-child{overflow:hidden;text-overflow:ellipsis}
.proj.in:hover .cap,body.near .proj.in .cap{opacity:1;transform:none}
/* filters: only the chosen kind of work stays bright */
.proj{transition:opacity .5s var(--quint)}
body[data-f] .proj{opacity:.1;pointer-events:none}
body[data-f="Branding"] .proj[data-c~="Branding"],body[data-f="Illustration"] .proj[data-c~="Illustration"],body[data-f="Creative-Direction"] .proj[data-c~="Creative-Direction"],body[data-f="Event-Design"] .proj[data-c~="Event-Design"]{opacity:1;pointer-events:auto}
.chips{display:inline-flex;gap:10px} .chips button{color:var(--g1)} .chips button.on{color:var(--fg)}
/* hover: the cursor becomes a small red circle with an arrow */
#cur{position:fixed;left:0;top:0;z-index:40;pointer-events:none}
#cur{z-index:300;opacity:0;transition:opacity .2s}
#cur.vis{opacity:1}
#cur i{display:grid;place-items:center;width:20px;height:20px;margin:-10px 0 0 -10px;background:var(--red);color:#fff;font-style:normal;font-size:11px;line-height:1;transform:scale(.45);transition:transform .35s var(--expo)}
#cur i b{font-weight:400;opacity:0;transition:opacity .2s}
#cur.on i{transform:scale(1)} #cur.on i b{opacity:1}
@media (hover:hover){ body.cur-on, body.cur-on *{cursor:none!important} }
@media (hover:none){ .proj.in h2,.proj.in .cap{opacity:1;transform:none} .proj h2{font-size:14px;color:var(--g1)} #cur{display:none} }
.proj.in .sq img,.proj.in .sq video{opacity:1}
.proj:hover .sq{transform:scale(1.03)}
.proj.empty .sq{background:transparent;border:1px dashed var(--g2);display:grid;place-items:center;text-align:center;padding:20px;font-size:19px;line-height:1.4}
.proj.empty .sq > div{opacity:0;transition:opacity 1s ease-out}
.proj.empty.in .sq > div{opacity:1}
.proj.empty .sq b{display:block;font-weight:500;font-size:27px;letter-spacing:-.02em;margin-bottom:8px}
.proj.src-hidden .sq{visibility:hidden}

#traces{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#traces path{fill:var(--trail);stroke:none;shape-rendering:crispEdges;animation:trailFade 26s linear forwards}
@keyframes trailFade{0%,35%{opacity:1}100%{opacity:0}}

/* Top-view figure (smaller) */
#fig{position:absolute;left:0;top:0;width:53px;height:70px;margin:-35px 0 0 -26.5px;pointer-events:none;z-index:6}
#fig .rot{width:100%;height:100%;transform-origin:50% 50%}
#fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;opacity:0}
#fig svg.on{opacity:1}
#fig .rot svg{filter:drop-shadow(0 0 .6px rgba(255,255,255,.9)) drop-shadow(0 1px 2px rgba(0,0,0,.12))}
#shade svg path{fill:#000}
/* small pixel drawings hidden in the gaps: they light up when the figure walks by */
.deco{position:absolute;pointer-events:none}
.deco svg{width:100%;height:100%;display:block;fill:#ececec;transition:fill .8s var(--quint)}
.deco.lit svg{fill:var(--trail)}
#bubble{position:fixed;left:0;top:0;z-index:12;pointer-events:none;background:#111;color:#fff;font-size:13px;font-weight:500;padding:6px 11px;border-radius:14px;white-space:nowrap;
  transform-origin:50% 100%;opacity:0;transition:opacity .35s var(--quint)}
#bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:#111;transform:translateX(-50%) rotate(45deg);border-radius:1px}
#bubble.on{opacity:1}
/* thought cloud: same bubble, little circles instead of the pointer */
#bubble.think{background:#111;color:#fff;font-weight:400;font-style:italic}
#bubble.think::after{width:7px;height:7px;bottom:-9px;border-radius:50%;transform:translateX(-30%)}
#bubble.think::before{content:"";position:absolute;left:50%;bottom:-16px;width:4px;height:4px;background:#111;border-radius:50%;transform:translateX(10%)}

/* ===== Chrome ===== */
.corner{position:fixed;width:26vw;height:26vh;pointer-events:none;z-index:8;background:rgba(236,236,236,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.corner.tl{left:0;top:0;-webkit-mask-image:radial-gradient(circle at 0 0,#000 0,transparent 70%);mask-image:radial-gradient(circle at 0 0,#000 0,transparent 70%)}
.corner.tr{right:0;top:0;-webkit-mask-image:radial-gradient(circle at 100% 0,#000 0,transparent 70%);mask-image:radial-gradient(circle at 100% 0,#000 0,transparent 70%)}
.corner.bl{left:0;bottom:0;-webkit-mask-image:radial-gradient(circle at 0 100%,#000 0,transparent 70%);mask-image:radial-gradient(circle at 0 100%,#000 0,transparent 70%)}
.corner.br{right:0;bottom:0;-webkit-mask-image:radial-gradient(circle at 100% 100%,#000 0,transparent 70%);mask-image:radial-gradient(circle at 100% 100%,#000 0,transparent 70%)}
header,footer{position:fixed;left:0;right:0;z-index:20;pointer-events:none;display:grid;grid-template-columns:repeat(6,1fr);gap:var(--pad);padding:var(--pad)}
header{top:0;padding-top:max(var(--pad),env(safe-area-inset-top));align-items:start}
footer{bottom:0;padding-bottom:max(var(--pad),env(safe-area-inset-bottom));align-items:end}
header .r,footer .r{text-align:right}
header > *,footer > *{pointer-events:auto}
header::before,footer::before{content:"";position:absolute;left:0;right:0;z-index:-1;pointer-events:none}
header::before{top:0;height:110px;background:linear-gradient(#ececec,rgba(236,236,236,.75) 60%,transparent)}
footer::before{bottom:0;height:150px;background:linear-gradient(rgba(236,236,236,0),rgba(222,222,222,.85) 55%,#cfcfcf)}
.reveal{opacity:0;transform:translateY(10px);transition:opacity .9s var(--quint),transform 1.1s var(--expo)}
.on .reveal,.reveal.on{opacity:1;transform:none}
footer .tools{display:flex;gap:14px;justify-content:center;font-variant-numeric:tabular-nums}

/* ===== Project view (opens with a shared-element flight) ===== */
#mask{position:fixed;inset:0;background:transparent;z-index:30;opacity:0;pointer-events:none;transition:opacity .55s var(--quint)}
#mask.on{opacity:1;pointer-events:auto;transition-delay:.12s}
#flyLayer{position:fixed;inset:0;z-index:36;pointer-events:none;perspective:1800px}
#flyLayer .fc{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;backface-visibility:hidden;box-shadow:0 24px 50px rgba(0,0,0,.12)}
#flyLayer .fc img{display:block;width:100%;height:100%;object-fit:cover}
.media .wait{visibility:hidden}
#flyer{position:fixed;left:0;top:0;z-index:36;pointer-events:none;display:none;perspective:1400px}
#flyer img{display:block;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%;backface-visibility:hidden}
/* while a project is open, everything else on the canvas steps back */
.proj{transition:opacity .35s var(--quint)}
body.focus .proj.src-hidden h2{opacity:0;transition:opacity .25s}
body.focus header,body.focus footer{opacity:0;transition:opacity .3s}
header,footer,#fig,#traces{transition:opacity .5s var(--quint)}
#view{position:fixed;inset:0;z-index:34;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;visibility:hidden}
#view.open{visibility:visible}
/* the page sits on the right half; the left half shows the map, blurred */
#view::before{content:"";position:fixed;top:0;bottom:0;left:50%;right:0;background:var(--bg);z-index:-1;transform:translateX(100%);transition:transform .7s var(--expo)}
#view.in::before{transform:none}
#view.out::before{transform:translateX(100%);transition-duration:.45s}
#view{isolation:isolate}
.v-top{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;margin-left:50%;padding:var(--pad);padding-top:max(var(--pad),env(safe-area-inset-top));background:linear-gradient(var(--bg) 60%,transparent)}
.v-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--pad);padding:0 var(--pad) 90px;margin-left:50%}
.v-hero{position:sticky;top:44px;align-self:start;aspect-ratio:1/1;width:100%;max-height:calc(100vh - 56px);max-width:calc((100vh - 56px) * var(--ar,1));background:var(--g3);overflow:hidden}
.v-hero img,.v-hero video{display:block;width:100%;height:100%;object-fit:cover;visibility:hidden}
.v-hero.show img,.v-hero.show video{visibility:visible}
.v-text{padding-top:4px}
.v-title{font-size:clamp(28px,3.4vw,48px);line-height:1;letter-spacing:-.035em;font-weight:500;margin-bottom:26px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--pad);margin-bottom:30px}
.facts span{color:var(--g1)} .facts b{display:block;color:var(--fg);font-weight:400;margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 3fr;gap:var(--pad);padding:14px 0;border-top:1px solid var(--g2)}
.row2 > span{color:var(--g1)}
.built{display:flex;flex-wrap:wrap;gap:6px}
.built li{list-style:none;border:1px solid var(--g2);padding:4px 9px;border-radius:20px}
.prose{font-size:14px;line-height:1.5;max-width:58ch}
.prose p+p{margin-top:10px}
.media{display:grid;gap:8px;margin-top:18px}
.media img,.media video,.media iframe{display:block;width:100%;background:var(--g3);border:0}
.media .pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:start}
.slot{position:relative;border:1px dashed var(--g2);display:grid;place-items:center;text-align:center;padding:24px;color:var(--g1)}
.slot b{display:block;color:var(--fg);font-weight:500;font-size:14px;margin-bottom:6px}
.slot .tag{position:absolute;top:10px;left:10px;border:1px solid var(--g2);padding:2px 8px;border-radius:20px}
.slot .spec{display:block;margin-top:10px;font-size:11px}
.slot p{max-width:40ch;line-height:1.45}
.v-foot{display:flex;justify-content:space-between;margin-top:36px;padding-top:12px;border-top:1px solid var(--g2)}
.v-solo{padding:0 var(--pad) 90px;margin-left:50%}
.st{opacity:0;transform:translateY(28px);clip-path:inset(0 0 100% 0);transition:opacity .8s var(--quint),transform 1.2s var(--expo),clip-path 1.2s var(--expo)}
#view.in .st{opacity:1;transform:none;clip-path:inset(-20px -20px -20px -20px)}
#view.out{opacity:0;transition:opacity .28s var(--quint)}
#view.out .st{transition-delay:0s !important}
.v-title{overflow:hidden}
.v-title .ln{display:inline-block;transform:translateY(105%);transition:transform 1.2s var(--expo)}
#view.in .v-title .ln{transform:none}
.big{display:block;font-size:clamp(22px,3.6vw,40px);font-weight:500;letter-spacing:-.03em;margin:4px 0 26px;word-break:break-all}
.links a{display:block;margin:3px 0}
form.contact{display:grid;gap:10px}
form.contact input,form.contact textarea{font:inherit;font-size:14px;color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--g2);padding:10px 0;outline:none;width:100%}
form.contact textarea{min-height:110px;resize:vertical}
form.contact input:focus,form.contact textarea:focus{border-color:var(--fg)}
form.contact button{justify-self:start;background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:20px;margin-top:6px}
.steps{display:grid;gap:10px;counter-reset:s}
.steps li{list-style:none;display:grid;grid-template-columns:28px 1fr;font-size:14px;line-height:1.45}
.steps li::before{counter-increment:s;content:counter(s,decimal-leading-zero);color:var(--g1);font-size:12px;padding-top:2px}
.steps b{font-weight:500;display:block}

#list{position:fixed;inset:0;z-index:33;background:var(--bg);padding:56px var(--pad) var(--pad);overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .5s var(--quint)}
#list.open{opacity:1;pointer-events:auto}
#list h2{font-size:12px;font-weight:400;color:var(--g1);margin:24px 0 6px}
#list .row{display:grid;grid-template-columns:40px 64px 2fr 1.4fr 1fr 90px;gap:var(--pad);align-items:center;padding:8px 0;border-top:1px solid var(--g2);width:100%;font-size:14px}
#list .row .th{width:64px;height:48px;background:var(--g3);overflow:hidden}
#list .row .th img{width:100%;height:100%;object-fit:cover}
#list .row:hover span{color:var(--fg)}
#lprev{position:fixed;left:0;top:0;z-index:40;width:260px;pointer-events:none;opacity:0;transition:opacity .25s var(--quint)}
#lprev.on{opacity:1}
#lprev img{width:100%;display:block}
.seg{display:inline-flex;gap:10px}
.seg button{color:var(--g1)} .seg button.on{color:var(--fg)}
#list .row span:nth-child(n+4){color:var(--g1)}
#list .close{position:fixed;top:var(--pad);right:var(--pad)}

@media (max-width:760px){
  header{grid-template-columns:1fr auto auto;gap:16px}
  .hide-m{display:none!important}
  footer{grid-template-columns:1fr 1fr}
  .v-grid{grid-template-columns:minmax(0,1fr)}
  .v-grid,.v-solo,.v-top{margin-left:0}
  #view::before{left:0}
  .v-hero{position:relative;top:0;max-width:none}
  .facts{grid-template-columns:1fr 1fr}
  .row2{grid-template-columns:1fr}
  #list .row{grid-template-columns:28px 52px 1fr 64px}
  #list .row .th{width:52px;height:40px}
  #list .row span:nth-child(4),#list .row span:nth-child(5){display:none}
  #lprev{display:none}
}

/* the territory around the first 12 is pale until the figure walks there */
.proj.ghost{opacity:.13;filter:grayscale(1)}
.proj.ghost h2,.proj.ghost .cap{visibility:hidden}
.proj.unlock{transition:opacity 1.4s var(--quint),filter 1.4s var(--quint)}
/* four tiny arrows around the figure: you can walk it with the keys or by clicking */
#keys{position:absolute;left:50%;top:50%;width:0;height:0;transition:opacity .6s var(--quint)}
#keys i{position:absolute;width:0;height:0;border:5px solid transparent;opacity:.6;animation:kp 2.4s ease-in-out infinite}
#keys i:nth-child(1){left:-5px;top:-54px;border-bottom:7px solid var(--fg);border-top:0}
#keys i:nth-child(2){left:-5px;top:47px;border-top:7px solid var(--fg);border-bottom:0}
#keys i:nth-child(3){left:-52px;top:-5px;border-right:7px solid var(--fg);border-left:0}
#keys i:nth-child(4){left:45px;top:-5px;border-left:7px solid var(--fg);border-right:0}
@keyframes kp{0%,100%{opacity:.25}50%{opacity:.7}}
#fig.walked #keys{opacity:0}
/* filters + map/list: top row, under the name */
.hrow{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.hrow .chips,.hrow .seg{gap:6px} .hrow .rt{display:flex;gap:6px;align-items:center}
.hrow button{border:1px solid #bdbdbd;border-radius:20px;padding:4px 11px;color:#777;background:rgba(236,236,236,.88);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:background .25s,color .25s,border-color .25s}
.hrow button:hover{color:var(--fg);border-color:var(--g1)}
.hrow button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.hrow button{white-space:nowrap}
@media (max-width:760px){ .hrow{flex-wrap:wrap;gap:6px} .hrow .chips{display:flex;width:100%;overflow-x:auto;scrollbar-width:none} .hrow .chips::-webkit-scrollbar{display:none} .hrow button{padding:4px 10px} .hrow .rt{margin-left:auto} #zFit{display:none} }
/* project page: short texts between the images */
.media .txt{padding:22px 0 26px;max-width:52ch}
.media .txt .k{display:block;color:var(--g1);margin-bottom:8px}
.media .txt p{font-size:16px;line-height:1.45;letter-spacing:-.01em}
.media .txt p+p{margin-top:10px}
.media .cap2{margin:-2px 0 6px;color:var(--g1)}
.media img{height:auto}

/* "you can move the map": a soft white hand swiping (no box, no label) */
#gest{position:fixed;left:0;top:0;z-index:21;width:44px;height:52px;margin:0 0 0 -22px;pointer-events:none;opacity:0;transition:opacity .7s var(--quint)}
#gest.on{opacity:.8}
#gest svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;fill:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3)) drop-shadow(0 4px 10px rgba(0,0,0,.12));transition:opacity .5s}
#gest .swipe{transform-origin:50% 90%;animation:swipe 2s cubic-bezier(.65,0,.35,1) infinite}
#gest:not(.pz) .pinch{display:none} #gest.pz .swipe{display:none}
#gest .pinch .a{animation:pa 2s cubic-bezier(.65,0,.35,1) infinite} #gest .pinch .b{animation:pb 2s cubic-bezier(.65,0,.35,1) infinite}
@keyframes swipe{0%,12%{transform:translateX(-16px) rotate(-8deg);opacity:0}24%{opacity:1}66%{transform:translateX(16px) rotate(8deg);opacity:1}82%,100%{transform:translateX(16px) rotate(8deg);opacity:0}}
@keyframes pa{0%,10%{transform:translate(-12px,-12px);opacity:0}22%{opacity:1}68%{transform:translate(0,0);opacity:1}85%,100%{transform:translate(0,0);opacity:0}}
@keyframes pb{0%,10%{transform:translate(12px,12px);opacity:0}22%{opacity:1}68%{transform:translate(0,0);opacity:1}85%,100%{transform:translate(0,0);opacity:0}}
@media (prefers-reduced-motion:reduce){ #gest svg,#gest .pinch circle{animation:none} }
/* the cursor is a small lamp: the figure's shadow falls away from it */
#shade{display:none}   /* shadow switched off: the figure stays flat, like the rest of the site */
#shade .srot{width:100%;height:100%;transform-origin:50% 50%}

.case{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--pad);padding:16px 0 4px;border-top:1px solid var(--g2)}
.case span{display:block;margin-bottom:8px} .case p{font-size:15px;line-height:1.42;letter-spacing:-.01em}
@media (max-width:760px){ .case{grid-template-columns:1fr;gap:14px} }
.avail{display:inline-flex;align-items:center;gap:6px;margin-top:3px} .avail i{width:6px;height:6px;background:var(--red);display:inline-block;animation:kp 2.4s ease-in-out infinite}
form.contact .note{min-height:1.2em;font-size:13px}

    const d = Math.hypot(x + w/2 - innerWidth/2, y + h/2 - innerHeight/2);
    if (d < bd){ bd = d; best = { bx, by, k, rect: { left: x, top: y, width: w, height: h } }; }
  }
  best.el = document.querySelector(`.block[data-bx="${best.bx}"][data-by="${best.by}"] .proj[data-k="${best.k}"]`);
  return best;
}
const picOf = e => { const im = e.querySelector(".sq img"); if (im) return im.currentSrc || im.src; const v = e.querySelector(".sq video"); return v ? v.poster : ""; };
const slotPic = sl => sl.tagName === "VIDEO" ? (sl.poster || "") : (sl.currentSrc || sl.src);
const clampRect = r => ({ left: r.left, width: r.width, height: r.height, top: Math.max(-r.height - 40, Math.min(innerHeight + 40, r.top)) });
function flyCard(src, from, to, delay, ms, dir){
  if (RM){ from = to; delay = 0; ms = 1; dir = 0; }
  const c = document.createElement("div"); c.className = "fc"; c.innerHTML = `<img src="${src}" alt="">`;
  Object.assign(c.style, { width: to.width + "px", height: to.height + "px", transform: `translate(${from.left}px,${from.top}px) scale(${from.width/to.width},${from.height/to.height})` });
  flyLayer.appendChild(c);
  const sx = from.width/to.width, sy = from.height/to.height;
  const mx = from.left + (to.left - from.left)*.45, my = from.top + (to.top - from.top)*.45, ms_ = sx + (1 - sx)*.55, my_ = sy + (1 - sy)*.55;
  return c.animate([
    { transform: `translate(${from.left}px,${from.top}px) scale(${sx},${sy}) rotateY(0deg) rotateX(0deg)` },
        { transform: `translate(${to.left}px,${to.top}px) scale(1,1) rotateY(0deg) rotateX(0deg)` }
  ], { duration: ms, delay, easing: "cubic-bezier(.65,0,.25,1)", fill: "both" }).finished.then(() => c);
}
async function openProject(i, el){
  if (busy) return; busy = true;
  closeList(); current = i; overlay = true; bubble.classList.remove("on");
  view.classList.remove("out","in");
  view.innerHTML = projectHTML(i); titleLines(); view.scrollTop = 0; watchVideos(); setHash(P[i].slug);
  view.classList.add("open"); view.setAttribute("aria-hidden","false");
  document.body.classList.add("focus"); mask.classList.add("on");
  const fmC = el && el.dataset.fm, first = view.querySelector(".media img, .media video"), slots = fmC && first && first.dataset.fm === fmC ? [first] : [];
  slots.forEach(sl => sl.classList.add("wait"));
  // let the first images get their real shape before measuring where they land
  if (!slots.length) view.classList.add("in");
  else await Promise.race([Promise.all(slots.filter(sl => sl.tagName === "IMG").map(im => im.decode().catch(() => {}))), new Promise(r => setTimeout(r, 450))]);
  const clicked = el ? { el, rect: el.querySelector(".sq").getBoundingClientRect() } : spotOf(i, CV[i][0].fm);
  flights = []; const used = new Set(), runs = [];
  slots.forEach((slot, n) => {
    const to = slot.getBoundingClientRect();
    if (!to.height || to.top > innerHeight - 40){ slot.classList.remove("wait"); return; }
    const fm = slot.dataset.fm;
    let spot = null;
    if (fm !== undefined){                                       // a file that lives on the map: collect it from there
      if (el && !used.has(el) && el.dataset.fm === fm) spot = { el, rect: clicked.rect };
      else spot = spotOf(i, fm);
    }
    if (!spot || (spot.el && used.has(spot.el))) spot = { el: null, rect: clicked && clicked.rect, from: true };   // otherwise it comes out of the clicked tile
    if (!spot.rect){ slot.classList.remove("wait"); return; }
    let from = clampRect(spot.rect);
    if (spot.from) from = { ...from, left: from.left + n*10, top: from.top + n*10 };
    const src = spot.el ? picOf(spot.el) : slotPic(slot);
    if (spot.el){ used.add(spot.el); spot.el.classList.add("src-hidden"); }
    const f = { slot, el: spot.el, k: spot.k, bx: spot.bx, by: spot.by, src, home: spot.from ? clicked.rect : null };
    flights.push(f);
    runs.push(flyCard(src, from, to, 0, 1000, 0).then(c => { slot.classList.remove("wait"); requestAnimationFrame(() => c.remove()); }));
  });
  slots.forEach(sl => { if (!flights.some(f => f.slot === sl)) sl.classList.remove("wait"); });
  setTimeout(() => view.classList.add("in"), 120);        // text rises line by line while the images travel
  await Promise.all(runs);
  busy = false;
}
async function closeView(){
  if (!view.classList.contains("open") || busy) return; busy = true;
  view.querySelectorAll("video").forEach(v => v.pause()); if (vidObs) vidObs.disconnect(); setHash("");
  const runs = [];
  flights.forEach((f, n) => {                               // every image flies back to where it came from
    const tileEl = f.el && f.el.isConnected ? f.el : null;
    const to = tileEl ? tileEl.querySelector(".sq").getBoundingClientRect() : f.home;
    if (!to) return;
    const from = clampRect(f.slot.getBoundingClientRect());
    f.slot.classList.add("wait");
    runs.push(flyCard(f.src, from, { left: to.left, top: to.top, width: to.width, height: to.height }, 0, 850, 0).then(c => {
      if (tileEl) tileEl.classList.remove("src-hidden");
      c.animate([{ opacity: 1 }, { opacity: 0 }], { duration: tileEl ? 1 : 220, fill: "forwards" }).finished.then(() => c.remove()); }));
  });
  view.classList.add("out");                               // all text leaves at once: no stacked layers
  setTimeout(() => { mask.classList.remove("on"); document.body.classList.remove("focus"); }, 120);
  await Promise.all([...runs, new Promise(r => setTimeout(r, 450))]);
  document.querySelectorAll(".src-hidden").forEach(x => x.classList.remove("src-hidden"));
  view.classList.remove("open","in","out"); view.setAttribute("aria-hidden","true"); view.innerHTML = "";
  flights = []; overlay = false; srcEl = null; busy = false;
}
function stepP(d){
  if (busy) return; busy = true;
  const i = (current + d + P.length) % P.length;
  view.classList.add("out");
  setTimeout(() => {
    document.querySelectorAll(".src-hidden").forEach(x => x.classList.remove("src-hidden")); flights = [];
    current = i; view.classList.remove("in","out");
    view.innerHTML = projectHTML(i); titleLines(); view.scrollTop = 0; watchVideos(); setHash(P[i].slug, true);
    // behind the view: the figure walks to that project
    const el = [...document.querySelectorAll(`.proj[data-i="${i}"]`)].filter(x => !x.classList.contains("ghost")).sort((a,b) => {
      const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
      return Math.hypot(ra.left-innerWidth/2, ra.top-innerHeight/2) - Math.hypot(rb.left-innerWidth/2, rb.top-innerHeight/2);
    })[0];
    requestAnimationFrame(() => requestAnimationFrame(() => { view.classList.add("in"); busy = false; }));
  }, 300);
}
view.addEventListener("click", e => { if (e.clientX < innerWidth/2 && innerWidth >= 760 && !e.target.closest(".v-grid,.v-solo,.v-top")) closeView(); });

}

/* the form sends straight to the inbox (FormSubmit); if that fails, it falls back to the visitor's email app */
async function sendForm(e){
  e.preventDefault(); const form = e.target, f = new FormData(form), btn = form.querySelector("button"), note = form.querySelector(".note");
  const body = `${f.get("message")}\n\n— ${f.get("name")} (${f.get("email")})\nProject: ${f.get("event")||"-"}`;
  btn.disabled = true; btn.textContent = "Sending…";
  try {
    const r = await fetch("https://formsubmit.co/ajax/" + EMAIL, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ name: f.get("name"), email: f.get("email"), project: f.get("event") || "-", message: f.get("message"), _subject: "Website enquiry — " + f.get("name"), _replyto: f.get("email"), _template: "table", _captcha: "false" }) });
    const j = await r.json().catch(() => ({}));
    const pending = /activat/i.test(j.message || "");               // first message ever: FormSubmit asks the owner to activate, the message still counts
    if (!pending && (!r.ok || j.success === "false" || j.success === false)) throw 0;
    form.reset(); btn.textContent = "Sent ✓"; note.textContent = "Thank you, your message is in my inbox. I’ll reply soon.";
  } catch(_){
    btn.disabled = false; btn.textContent = "Send";
    location.href = `mailto:${EMAIL}?subject=${encodeURIComponent("Website enquiry — " + f.get("name"))}&body=${encodeURIComponent(body)}`;
  }
}
